[project]
name = "holaboss-sandbox-agent-runtime"
version = "0.1.0"
description = "Standalone dependency manifest for sandbox agent runtime image."
requires-python = ">=3.12,<3.13"
dependencies = [
    "agno==2.4.2",
    "croniter",
    "fastapi[standard]>=0.115.12",
    "httpx[socks]>=0.28.1",
    "mcp>=1.6.0",
    "openai==2.11.0",
    "opencode-ai>=0.1.0a36",
    "pydantic>=2.9.2,<2.12",
    "PyYAML>=6.0",
    "sqlalchemy>=2.0,<3",
]

[project.scripts]
hb = "sandbox_agent_runtime.hb_cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

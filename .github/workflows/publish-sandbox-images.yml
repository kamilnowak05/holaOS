name: Publish Sandbox Images

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "runtime/deploy/**"
      - "runtime/src/**"
      - "runtime/pyproject.toml"
      - "runtime/uv.lock"
      - ".github/workflows/publish-sandbox-images.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-sandbox-images-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_TOOLCHAIN_IMAGE: ghcr.io/${{ github.repository_owner }}/holaboss-sandbox-base-toolchain
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/holaboss-sandbox-base
  FLY_APP_NAME: ${{ vars.FLY_APP_NAME || 'holaboss-sandbox' }}
  FLY_TOOLCHAIN_IMAGE: registry.fly.io/${{ vars.FLY_APP_NAME || 'holaboss-sandbox' }}
  FLY_IMAGE: registry.fly.io/${{ vars.FLY_APP_NAME || 'holaboss-sandbox' }}

jobs:
  publish-ghcr:
    name: Publish docker_container image (GHCR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME != '' && secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push GHCR toolchain image (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runtime/deploy/Dockerfile.toolchain
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.GHCR_TOOLCHAIN_IMAGE }}:latest
            ${{ env.GHCR_TOOLCHAIN_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=sandbox-toolchain-ghcr
          cache-to: type=gha,mode=max,scope=sandbox-toolchain-ghcr

      - name: Build and push GHCR runtime image (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runtime/deploy/Dockerfile
          build-args: |
            TOOLCHAIN_IMAGE=${{ env.GHCR_TOOLCHAIN_IMAGE }}:${{ github.sha }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=sandbox-runtime-ghcr
          cache-to: type=gha,mode=max,scope=sandbox-runtime-ghcr

      - name: Verify GHCR image
        run: docker buildx imagetools inspect "${GHCR_IMAGE}:${GITHUB_SHA}"

  publish-fly:
    name: Publish fly image (registry.fly.io)
    runs-on: ubuntu-latest
    needs: publish-ghcr
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Fly token is set
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "Missing required secret: FLY_API_TOKEN" >&2
            exit 1
          fi

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Authenticate Docker to Fly registry
        run: |
          if command -v fly >/dev/null 2>&1; then
            fly auth docker
          else
            flyctl auth docker
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Fly toolchain image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runtime/deploy/Dockerfile.toolchain
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.FLY_TOOLCHAIN_IMAGE }}:toolchain-latest
            ${{ env.FLY_TOOLCHAIN_IMAGE }}:toolchain-${{ github.sha }}
          cache-from: type=gha,scope=sandbox-toolchain-fly
          cache-to: type=gha,mode=max,scope=sandbox-toolchain-fly

      - name: Build and push Fly runtime image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runtime/deploy/Dockerfile
          build-args: |
            TOOLCHAIN_IMAGE=${{ env.FLY_TOOLCHAIN_IMAGE }}:toolchain-${{ github.sha }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.FLY_IMAGE }}:latest
            ${{ env.FLY_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=sandbox-runtime-fly
          cache-to: type=gha,mode=max,scope=sandbox-runtime-fly

      - name: Verify Fly image
        run: docker buildx imagetools inspect "${FLY_IMAGE}:${GITHUB_SHA}"

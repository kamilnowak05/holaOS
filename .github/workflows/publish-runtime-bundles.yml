name: Publish Runtime Bundles

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "runtime/deploy/**"
      - ".github/workflows/publish-runtime-bundles.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-runtime-bundles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ensure-runtime-release:
    name: Ensure runtime release exists
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: runtime-bundles-${{ github.ref_name }}
      RELEASE_TITLE: Runtime Bundles (${{ github.ref_name }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure runtime release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            prerelease_flag=()
            if [ "${GITHUB_REF_NAME}" != "main" ]; then
              prerelease_flag+=(--prerelease)
            fi
            gh release create "${RELEASE_TAG}" \
              --title "${RELEASE_TITLE}" \
              --notes "Versioned desktop runtime bundles for ${GITHUB_REF_NAME}." \
              --target "${GITHUB_SHA}" \
              "${prerelease_flag[@]}"
          fi

  publish-macos-runtime:
    name: Build macOS runtime bundle (${{ matrix.runtime_flavor }})
    needs: ensure-runtime-release
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime_flavor: holaboss
            output_dir: runtime-macos
            asset_prefix: holaboss-runtime-macos
            artifact_prefix: holaboss-runtime-macos
          - runtime_flavor: oss
            output_dir: runtime-macos-oss
            asset_prefix: holaboss-runtime-macos-oss
            artifact_prefix: holaboss-runtime-macos-oss
    env:
      RELEASE_TAG: runtime-bundles-${{ github.ref_name }}
      RELEASE_TITLE: Runtime Bundles (${{ github.ref_name }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv
        run: |
          "${{ env.pythonLocation }}/bin/python" -m pip install uv

      - name: Build macOS runtime bundle
        env:
          HOLABOSS_MACOS_PYTHON_BIN: ${{ env.pythonLocation }}/bin/python
          HOLABOSS_RUNTIME_FLAVOR: ${{ matrix.runtime_flavor }}
        run: |
          bash runtime/deploy/package_macos_runtime.sh "out/${{ matrix.output_dir }}"

      - name: Archive macOS runtime bundle
        run: |
          tar -C out -czf "out/${{ matrix.asset_prefix }}-${GITHUB_SHA}.tar.gz" "${{ matrix.output_dir }}"

      - name: Upload macOS runtime bundle release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${RELEASE_TAG}" \
            "out/${{ matrix.asset_prefix }}-${GITHUB_SHA}.tar.gz" \
            --clobber

      - name: Upload macOS runtime bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_prefix }}-${{ github.sha }}
          path: |
            out/${{ matrix.asset_prefix }}-${{ github.sha }}.tar.gz
            out/${{ matrix.output_dir }}/package-metadata.json
            out/${{ matrix.output_dir }}/runtime/metadata.json
          if-no-files-found: error
